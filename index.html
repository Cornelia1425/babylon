<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Babylon</title>
<style>
  :root { --ink: #f3ece2; --dim: #b8ad9d; --bar: #0b0a0d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bar); color: var(--ink); overflow: hidden;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Film bars */
  .bar { position: fixed; left: 0; right: 0; height: 9vh; min-height: 44px; background: var(--bar); display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  #bar-top { top: 0; justify-content: space-between; }
  #bar-bottom { bottom: 0; justify-content: space-between; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  h1 span { opacity: .5; }
  #status { color: var(--dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  #hint { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #prompt { position: fixed; left: 50%; bottom: calc(max(9vh, 44px) + 18px); transform: translateX(-50%); max-width: min(92vw, 520px);
    text-align: center; font-size: 15px; text-shadow: 0 1px 10px rgba(0,0,0,.55); pointer-events: none; transition: opacity .3s; }
  button { font: inherit; color: var(--ink); background: rgba(243,236,226,.08); border: 1px solid rgba(243,236,226,.22);
    padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  button:hover, button.held { background: rgba(243,236,226,.2); }
  .row { display: flex; gap: 8px; align-items: center; }
  #pad { position: fixed; right: 16px; bottom: calc(max(9vh, 44px) + 16px); display: none; flex-direction: column; gap: 10px; }
  #pad button { width: 64px; height: 64px; font-size: 22px; border-radius: 50%; background: rgba(11,10,13,.45); }
  @media (pointer: coarse) { #pad { display: flex; } #hint { display: none; } }
  /* The lens: darker corners and a little film grain */
  #lens { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(34,20,44,.34) 100%); }
  #lens::after { content: ""; position: absolute; inset: 0; opacity: .1; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #fade { position: fixed; inset: 0; background: #f6f1e7; opacity: 0; pointer-events: none; transition: opacity .7s ease; }
  #fade.on { opacity: 1; }
  #err { position: fixed; left: 20px; top: calc(max(9vh, 44px) + 10px); max-width: 70ch; color: #ffb3a6; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="lens"></div>

<div class="bar" id="bar-top">
  <h1>Babylon</h1>
  <div id="status"></div>
</div>

<div id="prompt"></div>

<div id="pad">
  <button id="t-up" aria-label="Climb">▲</button>
  <button id="t-down" aria-label="Go down">▼</button>
</div>

<div class="bar" id="bar-bottom">
  <div id="hint">W / S climb · rest on landings to get your breath back · Space cuts close / wide · Tab plays the other climber</div>
  <div class="row">
    <button id="b-cut">Cut</button>
    <button id="b-swap">Swap</button>
    <button id="b-invite">Invite</button>
  </div>
</div>

<div id="fade"></div>
<div id="err"></div>

<script>
  addEventListener('error', (e) => { document.getElementById('err').textContent += (e.message || e.error) + '\n'; });
  addEventListener('unhandledrejection', (e) => { document.getElementById('err').textContent += e.reason + '\n'; });
</script>
<script type="module" src="./src/climb.js"></script>
</body>
</html>
