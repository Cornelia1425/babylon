<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower (working title)</title>
<style>
  :root { --ink: #f3ece2; --dim: #a89f93; --line: rgba(243,236,226,.16); --bg: #0b0a0d; --warn: #9a9aa0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  header { position: fixed; left: 24px; top: 20px; pointer-events: none; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  header p { margin: 6px 0 0; color: var(--dim); max-width: 30ch; }
  #hud { position: fixed; left: 24px; bottom: 20px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #hud b { color: var(--ink); font-weight: 600; }
  #controls { position: fixed; right: 24px; bottom: 20px; display: flex; gap: 8px; }
  button { font: inherit; color: var(--ink); background: rgba(243,236,226,.06); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  button:hover { background: rgba(243,236,226,.14); }
  #panel { position: fixed; right: 24px; top: 20px; width: 300px; padding: 18px 18px 16px; background: rgba(16,14,18,.86);
    border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); }
  #panel[hidden] { display: none; }
  #panel .eyebrow { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  #panel h2 { margin: 4px 0 12px; font-size: 22px; font-weight: 600; }
  #panel dl { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  #panel dt { color: var(--dim); }
  #panel dd { margin: 0; }
  #panel .rule { margin: 0 0 10px; padding-left: 10px; border-left: 2px solid var(--ink); font-size: 15px; }
  #panel .detail { margin: 0 0 14px; color: var(--dim); }
  #panel .tag { display: inline-block; margin-bottom: 10px; padding: 2px 8px; border: 1px solid var(--warn); color: var(--warn);
    border-radius: 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  #panel .tag[hidden] { display: none; }
  #panel .row { display: flex; gap: 8px; }
  #hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); color: var(--dim); font-size: 12px; pointer-events: none; white-space: nowrap; }
  #fade { position: fixed; inset: 0; background: #f3ece2; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #fade.on { opacity: 1; }
  #err { position: fixed; left: 24px; top: 90px; max-width: 60ch; color: #ff8a7a; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  @media (max-width: 760px) { #hint { display: none; } #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 70px; } }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<header>
  <h1>Tower <span style="opacity:.5">working title</span></h1>
  <p>Every floor is one phrase of movement. Click anything to ask why it is there.</p>
</header>

<aside id="panel" hidden>
  <div class="eyebrow" id="p-eyebrow"></div>
  <h2 id="p-title"></h2>
  <span class="tag" id="p-tag" hidden>Default · no one chose this</span>
  <dl>
    <dt>Made by</dt><dd id="p-by"></dd>
    <dt>When</dt><dd id="p-when"></dd>
  </dl>
  <p class="rule" id="p-rule"></p>
  <p class="detail" id="p-detail"></p>
  <div class="row">
    <button id="p-replay">Replay this moment</button>
    <button id="p-close">Close</button>
  </div>
</aside>

<div id="hud"></div>
<div id="hint">drag to orbit · scroll to climb · pinch or shift+scroll to zoom · click a part</div>
<div id="controls">
  <button id="down" title="Down one floor">▼</button>
  <button id="up" title="Up one floor">▲</button>
  <button id="add">+ Add a floor</button>
</div>
<div id="fade"></div>
<div id="err"></div>

<script>
  addEventListener('error', (e) => { document.getElementById('err').textContent += (e.message || e.error) + '\n'; });
  addEventListener('unhandledrejection', (e) => { document.getElementById('err').textContent += e.reason + '\n'; });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
